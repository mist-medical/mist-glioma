# Builds the image, checks that its tools start, and pushes it to Docker Hub as
# mistmedical/mist-glioma:<version> and :latest.
#
# Runs after "Upload Python Package" succeeds. Run it manually from the Actions tab
# to test the build, and set "push" only to publish the result.
#
# Requires repo secrets: DOCKER_USERNAME, DOCKER_PASSWORD.
name: Publish Docker Images

on:
  workflow_dispatch:
    inputs:
      push:
        description: Push the image to Docker Hub
        type: boolean
        default: false
  workflow_run:
    workflows: [Upload Python Package]
    types: [completed]

permissions:
  contents: read

jobs:
  push_to_registry:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    env:
      PUSH: ${{ github.event_name == 'workflow_run' || inputs.push }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the exact commit that was released.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Read the version
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: mist-glioma:test
      - name: Check that the tools start
        run: |
          docker run --rm mist-glioma:test mist_glioma --help
          docker run --rm mist-glioma:test mist_predict --help
          docker run --rm mist-glioma:test hd-bet --help
          docker run --rm mist-glioma:test python -c "import torch; print(torch.__version__)"
      - name: Log in to Docker Hub
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push image
        if: env.PUSH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            mistmedical/mist-glioma:${{ env.VERSION }}
            mistmedical/mist-glioma:latest
