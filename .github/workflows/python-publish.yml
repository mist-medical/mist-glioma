# Builds the mist-glioma sdist and wheel and uploads them to PyPI whenever a GitHub
# Release is published. A successful run also triggers "Publish Docker Images".
#
# Requires repo secret: PYPI_API_TOKEN.
name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check that the release tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "$TAG" = "v$VERSION"
      - name: Build package
        run: |
          python -m pip install build
          python -m build
      # The action is pinned to a commit SHA for supply chain safety.
      - name: Publish package
        uses: pypa/gh-action-pypi-publish@27b31702a0e7fc50959f5ad993c78deac1bdfc29
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
